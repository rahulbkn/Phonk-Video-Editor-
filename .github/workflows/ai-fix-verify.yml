name: AI Fix Branch - Build + Verify + PR

# Runs on every push to an AI-generated fix branch (feature/ai-fix-*).
# Verification gate (Firebase-optional):
#   - If FIREBASE_PROJECT_ID + FIREBASE_SERVICE_ACCOUNT are set: Firebase Test Lab.
#   - Otherwise: local unit-test gate (deterministic, free).
# On PASS: opens/marks-ready a PR against main.
# On FAIL: does nothing further here — the worker (which pushed the branch)
# decides whether to retry based on .ai-debug/state.json attempt counts.

on:
  push:
    branches:
      - 'feature/ai-fix-**'

permissions:
  contents: read
  pull-requests: write

env:
  APP_MODULE: app

jobs:
  build-and-verify:
    name: Build + Verify (AI fix branch)
    runs-on: ubuntu-latest
    outputs:
      has_firebase: ${{ steps.firebase-check.outputs.has_firebase }}
      has_instrumentation: ${{ steps.detect.outputs.has_instrumentation }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Check for Firebase secrets
        id: firebase-check
        env:
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$PROJECT" ] && [ -n "$SA" ]; then
            echo "has_firebase=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_firebase=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install NDK + CMake (Firebase path only)
        if: steps.firebase-check.outputs.has_firebase == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;27.1.12297006" "cmake;4.1.2"
          if [ ! -d "$ANDROID_HOME/cmake/4.1.2" ]; then
            echo "::error::CMake missing after sdkmanager install"
            exit 1
          fi

      - name: Strip Termux-only gradle.properties overrides for CI
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          sed -i '/android.builder.sdkDownload/d' gradle.properties
          sed -i '/org.gradle.jvmargs=/s/=.*/=-Xmx3g -Dfile.encoding=UTF-8/' gradle.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Detect instrumentation tests
        id: detect
        run: |
          if [ -d "${APP_MODULE}/src/androidTest" ] && \
             [ "$(find ${APP_MODULE}/src/androidTest -name '*.kt' -o -name '*.java' 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "has_instrumentation=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_instrumentation=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests (deterministic local gate)
        run: ./gradlew testDebugUnitTest
        continue-on-error: true

      - name: Build debug APK
        if: steps.firebase-check.outputs.has_firebase == 'true'
        run: ./gradlew assembleDebug

      - name: Build debug androidTest APK
        if: steps.firebase-check.outputs.has_firebase == 'true' && steps.detect.outputs.has_instrumentation == 'true'
        run: ./gradlew assembleDebugAndroidTest

      - name: Locate APKs
        id: locate
        if: steps.firebase-check.outputs.has_firebase == 'true'
        run: |
          APK=$(find . -path "*/build/outputs/apk/debug/*.apk" -not -name "*androidTest*" | head -n 1)
          TEST_APK=$(find . -path "*/build/outputs/apk/androidTest/debug/*.apk" | head -n 1 || true)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "test_apk_path=$TEST_APK" >> "$GITHUB_OUTPUT"

      - name: Upload unit-test result XMLs
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore

      - name: Authenticate to Google Cloud
        if: steps.firebase-check.outputs.has_firebase == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.firebase-check.outputs.has_firebase == 'true'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Run Firebase Test Lab
        if: steps.firebase-check.outputs.has_firebase == 'true'
        run: |
          set +e
          mkdir -p ci-results
          if [ "${{ steps.detect.outputs.has_instrumentation }}" = "true" ]; then
            gcloud firebase test android run \
              --type instrumentation \
              --app "${{ steps.locate.outputs.apk_path }}" \
              --test "${{ steps.locate.outputs.test_apk_path }}" \
              --device model=redfin,version=30,locale=en,orientation=portrait \
              --timeout 20m --format=json > ci-results/raw-testlab-output.json
          else
            gcloud firebase test android run \
              --type robo \
              --app "${{ steps.locate.outputs.apk_path }}" \
              --device model=redfin,version=30,locale=en,orientation=portrait \
              --timeout 10m --format=json > ci-results/raw-testlab-output.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse results (Firebase path)
        if: steps.firebase-check.outputs.has_firebase == 'true'
        continue-on-error: true
        run: python3 scripts/parse_firebase_results.py

      - name: Parse results (local unit-test gate)
        if: steps.firebase-check.outputs.has_firebase == 'false'
        continue-on-error: true
        run: python3 scripts/parse_local_results.py

      - name: Write job summary
        if: always()
        run: cat ci-results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ci-results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results-${{ github.run_id }}
          path: ci-results
          retention-days: 30

      - name: Check status
        id: status
        if: always()
        run: |
          if [ -f ci-results/summary.json ]; then
            STATUS=$(python3 -c "import json;print(json.load(open('ci-results/summary.json'))['status'])")
          else
            STATUS="blocked"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Read AI debug state (attempt history)
        id: state
        if: always()
        run: |
          if [ -f .ai-debug/state.json ]; then
            ATTEMPTS=$(python3 -c "import json;print(json.load(open('.ai-debug/state.json')).get('attempts', '?'))")
            echo "attempts=$ATTEMPTS" >> "$GITHUB_OUTPUT"
          else
            echo "attempts=?" >> "$GITHUB_OUTPUT"
          fi

      - name: Open/update PR on PASS
        if: steps.status.outputs.status == 'passed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          TITLE="AI fix: verified on CI ($BRANCH)"
          BODY=$(printf 'Automated fix generated by the OpenCode debug loop.\n\n**Attempts:** %s\n**Verification:** PASS\n**Workflow run:** %s\n\nSee .ai-debug/state.json on this branch for the full attempt-by-attempt history (root cause + fix per attempt).' \
            "${{ steps.state.outputs.attempts }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          if gh pr view "$BRANCH" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
            gh pr ready "$BRANCH"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi

      - name: Fail job if verification failed
        if: steps.status.outputs.status == 'failed'
        run: exit 1
