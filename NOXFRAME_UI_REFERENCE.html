<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Noxframe Dark Phonk Editor UI</title>
<style>
:root{--bg:#09090e;--s:#111118;--s2:#17171f;--s3:#20202a;--t:#f7f7fb;--m:#8f909d;--p:#ff2f98;--line:#292934}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}.app{min-height:100vh;background:var(--bg)}
.top{height:72px;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#0c0c12;border-bottom:1px solid var(--line)}
.icon{width:44px;height:44px;border:0;border-radius:13px;background:var(--s2);font-size:20px}.project{flex:1}.project b{display:block}.project small{color:var(--m)}
.actions{display:flex;gap:7px}.export{border:0;border-radius:15px;padding:13px 21px;background:var(--p);font-weight:750}
.aspect{display:flex;gap:8px;padding:10px 16px;background:var(--s);overflow:auto;border-bottom:1px solid var(--line)}
.aspect button{border:1px solid var(--line);background:var(--s2);padding:11px 19px;border-radius:12px;white-space:nowrap}.aspect .active{background:var(--p);border-color:var(--p);font-weight:700}
.preview{padding:14px 16px 8px}.video{height:min(48vh,520px);min-height:280px;background:#020205;border:1px solid var(--line);border-radius:18px;position:relative;overflow:hidden;display:grid;place-items:center}
.video .art{width:100%;height:100%;background:radial-gradient(circle at 50% 35%,#7e176b 0,#30133f 28%,#100d20 62%,#030307 100%);display:grid;place-items:center}
.video .art:after{content:"PHONK  •  NOXFRAME";font-size:clamp(24px,5vw,52px);font-weight:900;letter-spacing:4px;color:#ff5ab0;text-shadow:0 0 24px #ff1590aa}
.full{position:absolute;right:13px;bottom:13px;width:42px;height:42px;border:1px solid #fff2;border-radius:13px;background:#0009}
.controls{display:flex;align-items:center;gap:12px;padding:10px 2px}.play{width:52px;height:52px;border:0;border-radius:50%;background:var(--p);font-size:20px}.time{color:var(--p);font-size:18px;font-variant-numeric:tabular-nums}.dur{color:var(--m);margin-left:auto}.seek{height:5px;flex:1;background:#373740;border-radius:10px}.seek i{display:block;width:30%;height:100%;background:var(--p);border-radius:10px}
.timeline{background:#0d0d13;border-top:1px solid var(--line);overflow:hidden}.ticks{height:34px;display:flex;justify-content:space-around;padding-left:170px;align-items:center;color:#70717d;font-size:11px}.tracks{position:relative;overflow:auto}.track{height:62px;min-width:950px;display:flex;border-bottom:1px solid #20202a}.label{position:sticky;left:0;z-index:2;width:170px;min-width:170px;background:#101017;border-right:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 13px;color:#c7c7d0}.content{flex:1;padding:7px 9px;background:#0c0c12}.clip{height:48px;border-radius:9px;border:1px solid #363642;background:var(--s3);position:relative;overflow:hidden}.video-clip{background:linear-gradient(90deg,#39132f,#701653,#251b3c)}.audio-clip{background:#49153f}.effect{background:#2b2254}.wave{position:absolute;inset:0;opacity:.65;background:repeating-linear-gradient(90deg,transparent 0 5px,#ff70bb 5px 7px,transparent 7px 11px)}
.playhead{position:absolute;top:0;bottom:0;left:43%;width:2px;background:var(--p);z-index:5}.playhead:before{content:"";position:absolute;top:0;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--p)}
.tools,.bottom{display:flex;gap:8px;overflow:auto;padding:10px 14px;background:#0e0e14;border-top:1px solid var(--line)}.tool{min-width:82px;padding:9px 11px;border:1px solid var(--line);border-radius:12px;background:var(--s2);text-align:center;font-size:12px}.bottom{padding-bottom:calc(10px + env(safe-area-inset-bottom))}.bottom .tool{height:62px;border-color:transparent}.bottom .active{background:var(--p);border-color:var(--p)}
.panel{padding:13px 16px;background:var(--s);border-top:1px solid var(--line)}.panel h3{margin:0 0 10px;font-size:14px}.cards{display:flex;gap:10px;overflow:auto}.card{min-width:120px;padding:15px;border:1px solid var(--line);border-radius:13px;background:var(--s2)}

/* ---------- MOBILE + TABLET RESPONSIVE ---------- */

/* Tablet: 601–1024px */
@media (min-width:601px) and (max-width:1024px){
  .top{height:70px;padding:10px 18px}
  .preview{padding:14px 20px 10px}
  .video{height:min(50vh,560px);min-height:320px}
  .aspect{padding-left:20px;padding-right:20px}
  .timeline .track{min-width:1050px}
  .label{width:180px;min-width:180px}
  .ticks{padding-left:180px}
  .panel{padding:14px 20px}
  .bottom{padding-left:20px;padding-right:20px}
  .bottom .tool{min-width:92px}
}

/* Phones */
@media (max-width:600px){
  html,body{width:100%;min-width:0;overflow-x:hidden}
  .app{width:100%;min-height:100dvh;overflow:hidden}

  .top{
    height:auto;
    min-height:64px;
    padding:8px 9px;
    gap:7px;
    position:sticky;
    top:0;
    z-index:20;
  }
  .top .icon{width:40px;height:40px;min-width:40px}
  .project{min-width:0;overflow:hidden}
  .project b{
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .project small{
    display:block;
    font-size:9px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .actions{gap:4px}
  .actions .icon:nth-child(1),
  .actions .icon:nth-child(2){display:none}
  .export{
    padding:10px 13px;
    border-radius:13px;
    white-space:nowrap;
    font-size:14px;
  }
  .more{display:grid!important}

  .aspect{
    padding:8px 10px;
    gap:7px;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .aspect::-webkit-scrollbar{display:none}
  .aspect button{
    min-width:64px;
    padding:10px 13px;
    font-size:13px;
  }

  .preview{padding:9px 9px 5px}
  .video{
    width:100%;
    height:auto;
    aspect-ratio:16/9;
    min-height:0;
    max-height:48dvh;
    border-radius:14px;
  }
  .full{
    width:40px;height:40px;
    right:9px;bottom:9px;
  }

  .controls{
    gap:7px;
    padding:8px 0 4px;
    flex-wrap:nowrap;
  }
  .controls .icon{
    width:38px;height:38px;
    min-width:38px;
    border-radius:11px;
    font-size:16px;
  }
  .play{
    width:46px;height:46px;
    min-width:46px;
  }
  .time{font-size:15px;white-space:nowrap}
  .dur{font-size:12px;white-space:nowrap}
  .seek{min-width:60px}

  .timeline{
    width:100%;
    overflow:hidden;
  }
  .ticks{
    height:30px;
    min-width:900px;
    padding-left:125px;
    padding-right:20px;
    justify-content:space-around;
    font-size:10px;
  }
  .tracks{
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    touch-action:pan-x;
  }
  .track{
    height:58px;
    min-width:900px;
  }
  .label{
    width:125px;
    min-width:125px;
    padding:0 9px;
    font-size:11px;
  }
  .content{padding:6px 8px}
  .clip{height:45px;border-radius:8px}

  .playhead{left:35%}
  .playhead:before{
    width:11px;height:11px;
    left:-4.5px;
  }

  .tools{
    padding:8px 9px;
    gap:7px,
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .tools::-webkit-scrollbar,
  .bottom::-webkit-scrollbar{display:none}
  .tool{
    min-width:76px;
    padding:8px 9px;
    font-size:11px;
    flex:0 0 auto;
  }

  .panel{
    padding:12px 10px;
    max-height:34dvh;
    overflow:auto;
  }
  .panel h3{font-size:13px}
  .cards{gap:8px}
  .card{
    min-width:105px;
    padding:13px;
    font-size:12px;
  }

  .bottom{
    position:sticky;
    bottom:0;
    z-index:15;
    width:100%;
    padding:8px 9px calc(8px + env(safe-area-inset-bottom));
    gap:6px,
    scrollbar-width:none;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    background:rgba(14,14,20,.97);
    backdrop-filter:blur(12px);
  }
  .bottom .tool{
    min-width:72px;
    height:58px;
    font-size:10px,
  }
}

/* Very small phones: 320–360px */
@media (max-width:360px){
  .top{padding-left:6px;padding-right:6px}
  .top .icon{width:38px;height:38px;min-width:38px}
  .export{padding:9px 10px;font-size:13px}
  .project small{font-size:8px}
  .aspect button{min-width:59px;padding:9px 10px}
  .preview{padding-left:6px;padding-right:6px}
  .controls .icon{width:35px;height:35px;min-width:35px}
  .play{width:43px;height:43px;min-width:43px}
  .time{font-size:13px}
  .dur{font-size:10px}
  .label{width:112px;min-width:112px}
  .ticks{padding-left:112px}
  .track{min-width:820px}
  .bottom .tool{min-width:68px}
}

/* Landscape phones */
@media (max-width:900px) and (orientation:landscape){
  .top{min-height:54px;height:54px}
  .aspect{padding-top:5px;padding-bottom:5px}
  .preview{padding-top:6px}
  .video{
    aspect-ratio:16/8;
    max-height:55dvh;
  }
  .panel{max-height:28dvh}
  .bottom .tool{height:52px}
}


/* Global touch/scroll behavior */
button{-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--p);outline-offset:2px}
.timeline,.aspect,.tools,.bottom,.cards{overscroll-behavior-x:contain}
@media (pointer:coarse){
  button{min-height:44px}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
<button class="icon">‹</button>
<div class="project"><b>part1.mp4</b><small>1920×1080 · 30fps · 00:33</small></div>
<div class="actions"><button class="icon">↶</button><button class="icon">↷</button><button class="export">⇧ Export</button><button class="icon">⋮</button></div>
</header>
<nav class="aspect"><button class="active">9:16</button><button>1:1</button><button>16:9</button><button>4:5</button><button>21:9</button><button>⛶</button></nav>
<section class="preview">
<div class="video"><div class="art"></div><button class="full">⛶</button></div>
<div class="controls"><button class="icon">⏮</button><button class="play">▶</button><button class="icon">⏭</button><span class="time">0:09.738</span><div class="seek"><i></i></div><span class="dur">0:33.000</span></div>
</section>
<section class="timeline">
<div class="ticks"><span>00:00</span><span>00:05</span><span>00:10</span><span>00:15</span><span>00:20</span><span>00:25</span><span>00:30</span></div>
<div class="tracks">
<div class="playhead"></div>
<div class="track"><div class="label">☰ 🎞 Video</div><div class="content"><div class="clip video-clip"></div></div></div>
<div class="track"><div class="label">☰ ♪ Audio</div><div class="content"><div class="clip audio-clip"><div class="wave"></div></div></div></div>
<div class="track"><div class="label">☰ T Overlay</div><div class="content"><div class="clip effect" style="width:55%"></div></div></div>
<div class="track"><div class="label">☰ T Text</div><div class="content"><div class="clip effect" style="width:42%"></div></div></div>
<div class="track"><div class="label">☰ ✧ Effect</div><div class="content"><div style="display:flex;gap:10px"><div class="clip effect" style="width:18%"></div><div class="clip effect" style="width:24%"></div><div class="clip effect" style="width:17%"></div></div></div></div>
<div class="track"><div class="label">☰ ◉ Audio FX</div><div class="content"><div class="clip" style="background:#123b36"></div></div></div>
</div>
</section>
<nav class="tools"><button class="tool">✂<br>Split</button><button class="tool">[ ]<br>Trim</button><button class="tool">◔<br>Speed</button><button class="tool">🔊<br>Volume</button><button class="tool">◉<br>Filter</button><button class="tool">⌫<br>Delete</button><button class="tool">▣<br>Duplicate</button></nav>
<section class="panel"><h3>Media</h3><div class="cards"><div class="card">🎞<br><br>Videos</div><div class="card">♪<br><br>Audio</div><div class="card">▧<br><br>Photos</div></div></section>
<nav class="bottom"><button class="tool active">▣<br>Media</button><button class="tool">♪<br>Audio</button><button class="tool">Tᵀ<br>Text</button><button class="tool">◇<br>Overlay</button><button class="tool">✧<br>Effect</button><button class="tool">☷<br>Adjust</button><button class="tool">☺<br>Sticker</button></nav>
</div>
</body>
</html>
